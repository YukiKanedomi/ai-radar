name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      # 2026-11-24: deploy-pages が直後に "Found 0 artifact(s)" で落ちることが続いた（上げた物が一覧に出る前に探しに行く）。少し待つ
      - run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
